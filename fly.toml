app = "stockdash"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/app/cache"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
